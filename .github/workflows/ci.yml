name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  # Fila de merge do GitHub: testa o PR já combinado com o que entrou antes dele (evita "verde sozinho, vermelho junto").
  merge_group:

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Catálogo de regressão atualizado e todos os testes são executados
        run: pnpm qa:catalogo:check

      - name: Typecheck shared
        run: pnpm --filter @periscopio/shared typecheck

      - name: Typecheck API
        run: pnpm --filter @periscopio/api typecheck

      - name: Typecheck web
        run: pnpm --filter @periscopio/web typecheck

      - name: Build API
        run: pnpm --filter @periscopio/api build

      - name: Build web
        run: pnpm --filter @periscopio/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  api-tests:
    name: API tests & E2E da jornada
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: periscopio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python do extrator da base individual (planilha sintética)
        run: |
          pip install openpyxl pytest
          python -m pytest -q apps/api/scripts/taruma

      - name: Testes unitários + E2E (banco descartável, dados sintéticos)
        run: pnpm --filter @periscopio/api test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/periscopio_test
          DATABASE_URL: postgres://postgres@localhost:5432/periscopio_test
          # Os testes de rotas administrativas usam este e-mail via x-test-email como Super Admin
          # (em produção a lista vem do Render; sem ela todo teste administrativo recebe 403).
          SUPERADMIN_EMAILS: bruno@oceanoazul.dev.br

  bi-rag-tests:
    name: Assistente do BI (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/bi-rag/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r apps/bi-rag/requirements-dev.txt
      - name: Testes do planejador e do serviço
        run: python -m pytest -q
        working-directory: apps/bi-rag

  exigir-teste:
    name: Trava - mudança de produto traz teste
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exigir teste (rótulo `sem-teste` dispensa, com motivo no PR)
        run: node qa/exigir-teste.mjs origin/${{ github.base_ref }}
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
