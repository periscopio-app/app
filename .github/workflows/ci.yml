name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: pnpm --filter @periscopio/shared typecheck

      - name: Typecheck API
        run: pnpm --filter @periscopio/api typecheck

      - name: Typecheck web
        run: pnpm --filter @periscopio/web typecheck

      - name: Build API
        run: pnpm --filter @periscopio/api build

      - name: Build web
        run: pnpm --filter @periscopio/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  api-tests:
    name: API tests & E2E da jornada
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: periscopio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python do extrator da base individual (planilha sintética)
        run: |
          pip install openpyxl pytest
          python -m pytest -q apps/api/scripts/taruma

      - name: Testes unitários + E2E (banco descartável, dados sintéticos)
        run: pnpm --filter @periscopio/api test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/periscopio_test

  bi-rag-tests:
    name: Assistente do BI (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/bi-rag/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r apps/bi-rag/requirements-dev.txt
      - name: Testes do planejador e do serviço
        run: python -m pytest -q
        working-directory: apps/bi-rag
