name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: pnpm --filter @periscopio/shared typecheck

      - name: Typecheck API
        run: pnpm --filter @periscopio/api typecheck

      - name: Typecheck web
        run: pnpm --filter @periscopio/web typecheck

      - name: Build API
        run: pnpm --filter @periscopio/api build

      - name: Build web
        run: pnpm --filter @periscopio/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
