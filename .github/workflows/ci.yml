name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: pnpm --filter @periscopio/shared typecheck

      - name: Typecheck API
        run: pnpm --filter @periscopio/api typecheck

      - name: Typecheck web
        run: pnpm --filter @periscopio/web typecheck

      - name: Build API
        run: pnpm --filter @periscopio/api build

      - name: Build web
        run: pnpm --filter @periscopio/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  api-tests:
    name: API tests & E2E da jornada
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: periscopio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Testes unitários + E2E (banco descartável, dados sintéticos)
        run: pnpm --filter @periscopio/api test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/periscopio_test
