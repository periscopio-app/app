services:
  - type: web
    name: periscopio-api
    runtime: node
    plan: starter
    rootDir: apps/api
    healthCheckPath: /health
    # Render sets NODE_ENV=production before the build. Keep runtime packages
    # production-only, but install build tooling such as tsup for this phase.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EXPERT_MEET_URL
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: BI_RAG_URL
        sync: false
      - key: BI_RAG_TOKEN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_JWKS_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SEED_MASTER_1_EMAIL
        sync: false
      - key: SEED_MASTER_1_PASSWORD
        sync: false
      - key: SEED_MASTER_1_NAME
        sync: false
      - key: SEED_MASTER_2_EMAIL
        sync: false
      - key: SEED_MASTER_2_PASSWORD
        sync: false
      - key: SEED_MASTER_2_NAME
        sync: false

  - type: keyvalue
    name: periscopio-redis
    plan: starter
    ipAllowList: []

  # Assistente do BI (Python). Sem banco e sem dado de aluno; plano gratuito basta (pode "dormir" e acordar sob demanda).
  - type: web
    name: periscopio-bi-rag
    runtime: python
    plan: free
    rootDir: apps/bi-rag
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BI_RAG_TOKEN
        sync: false
      # Opcional e desligado por padrão: ver apps/bi-rag/README.md (Privacidade) antes de definir.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BI_LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
